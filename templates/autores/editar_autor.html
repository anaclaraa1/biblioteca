{% extends 'base.html' %}

{% block title %}
    Editar Autor
{% endblock %}

{% block title_page %}
    Editar Autor
{% endblock %}

{% block content %}
    <form action="{{ url_for('autor.editar_autor', autor_id=autor.ID_autor) }}" method="post">
        <label for="Nome_autor">Nome:</label>
        <input type="text" name="Nome_autor" placeholder="nome" value="{{ autor.Nome_autor }}">
        <label for="Nacionalidade">Nacionalidade:</label>
        <input type="text" name="Nacionalidade" placeholder="nacionalidade" value="{{ autor.Nacionalidade }}">
        <label for="Data_nascimento">Nascimento:</label>
        <input type="date" name="Data_nascimento" placeholder="nascimento" value="{{ autor.Data_nascimento }}">
        <label for="Biografia">Biografia:</label>
        <textarea name="Biografia" placeholder="Escreva algo..." value="{{ autor.Biografia }}"></textarea>
        <button>Enviar</button>
    </form>
{% endblock %}
