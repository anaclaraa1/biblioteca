{% extends 'base.html' %}

{% block title %}
    Editar Emprestimo
{% endblock %}

{% block title_page %}
    Editar Emprestimo
{% endblock %}

{% block content %}
    <form action="{{ url_for('emprestimo.editar_emprestimo', emprestimo_id=emprestimo.ID_emprestimo) }}" method="post">
        <label for="data_emprestimo">Data do empréstimo:</label>
        <input type="date" id="data_emprestimo" name="Data_emprestimo" placeholder="empréstimo" value="{{emprestimo.Data_emprestimo}}">
        <label for="data_devolucao">Data da devolução:</label>
        <input type="date" id="data_devolucao" name="Data_devolucao_prevista" placeholder="devolução" value="{{emprestimo.Data_devolucao_prevista}}">
        <label for="data_devolucao_real">Data da devolução real:</label>
        <input type="date" id="data_devolucao_real" name="Data_devolucao_real" placeholder="devolução real" value="{{emprestimo.Data_devolucao_real}}">
        <button>Enviar</button>
    </form>
{% endblock %}
