{% extends 'base.html' %}

{% block title %}
    Editar Emprestimo
{% endblock %}

{% block title_page %}
    Editar Emprestimo
{% endblock %}

{% block content %}
    <form action="" method="post">
        <label for="data_emprestimo">Data do empréstimo:</label>
        <input type="date" id="data_emprestimo" name="Data_emprestimo" placeholder="empréstimo" required>
        <label for="data_devolucao">Data da devolução:</label>
        <input type="date" id="data_devolucao" name="Data_devolucao" placeholder="devolução" required>
        <label for="data_devolucao_real">Data da devolução real:</label>
        <input type="date" id="data_devolucao_real" name="Data_devolucao_real" placeholder="devolução real" required>
        <label for="Status_emprestimo">Status:</label>
        <select id="status" name="Status_emprestimo">
            <option value="pendente">Pendente</option>
            <option value="devolvido">Devolvido</option>
            <option value="atrasado">Atrasado</option>
        </select>
        <button>Enviar</button>
    </form>
{% endblock %}
